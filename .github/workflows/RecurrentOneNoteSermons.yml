name: Worship-Email-to-OneNote-Page

on:
  schedule:
    # Saturdays at 02:00 UTC = Friday 19:00 MT (church email lands Saturday evening)
    # Adjust if your timezone or the email's arrival time shifts.
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sermon note titling script
        env:
          EMAIL_SERVER: ${{ secrets.EMAIL_SERVER }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          RECEIVING_ADDRESS: ${{ secrets.RECEIVING_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          INCOMING_EMAIL: ${{ secrets.INCOMING_EMAIL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          SECTION_ID: ${{ secrets.SECTION_ID }}
        run: python Scripts/SermonNoteTitlingPrep.py
