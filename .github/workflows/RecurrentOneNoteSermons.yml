name: Worship-Email-to-OneNote-Page

on: 
  schedule:
    - cron: '0 5 * * 6'
  workflow_dispatch:     # optional: allow manual runs for testing
  types: # run .py file

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository content
       # uses: actions/checkout@v2 # Checkout the repository content to github runner.

      - name: Setup Python Version
       # uses: actions/setup-python@v2
        with:
          python-version: 3.8 # Install the python version needed

      - name: Install Python dependencies
       # run: python -m pip install --upgrade pip requests

      - name: Execute Python script # Run the run.py to get the latest data
          env:
              EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
              RECEIVING_ADDRESS: ${{ secrets.RECEIVING_ADDRESS }}
              EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
              ONENOTE_TOKEN: ${{ secrets.ONENOTE_TOKEN }}
              SENDER_ADDRESS: ${{ secrets.SENDER_ADDRESS }}
              ONENOTE_TOKEN: ${{ secrets.ONENOTE_TOKEN }}
              ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN ]]
              CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
              SECTION_ID: ${{ secrets.SECTION_ID }}
              TENANT_ID: ${{ secrets.TENANT_ID }}
          # run: 'SermonNoteTitlingPrep.py'
